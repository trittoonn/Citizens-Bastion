# Render Blueprint (Soporta despliegue unificado con Docker)
# También podés crear un Static Site separado apuntando a `frontend/` con la variable BACKEND_URL.
services:
  - type: web
    name: citizens-bastion
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8080
      # Opcional: si servís el front desde otro dominio o querés fijar la URL pública del backend:
      - key: BACKEND_URL
        value: ""
